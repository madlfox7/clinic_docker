{% extends "base.html" %}
{% block content %}

<h1>Patient registration</h1>
{% if error %}<p>{{ error }}</p>{% endif %}
<form method="post" action="/register">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  <p>Email: <input name="email" type="email" maxlength="254" value="{{ email }}" required></p>
  <p>Password: <input name="password" type="password" minlength="8" maxlength="72" required></p>
  <p>Confirm password: <input name="confirm_password" type="password" minlength="8" maxlength="72" required></p>
  <button type="submit">Create patient account</button>
</form>
<p><a href="/login">Back to login</a></p>
{% endblock %}
