{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="card-body p-4">
<h1>Choose a new password</h1>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
{% if token %}
  <form method="post" action="/reset-password">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="mb-3"><label class="form-label w-100">New password <input class="form-control" name="new_password" type="password" minlength="8" maxlength="72" required></label></div>
    <div class="mb-3"><label class="form-label w-100">Confirm <input class="form-control" name="confirm_password" type="password" minlength="8" maxlength="72" required></label></div>
    <button class="btn btn-primary w-100" type="submit">Update password</button>
  </form>
{% endif %}
<p class="mt-3 mb-0"><a href="/forgot-password">Forgot password?</a> | <a href="/login">Back to login</a></p>
  </div>
</div>
{% endblock %}
