{% extends "base.html" %}
{% block content %}
<h1>Choose a new password</h1>
{% if error %}<p>{{ error }}</p>{% endif %}
{% if token %}
  <form method="post" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New password <input name="new_password" type="password" minlength="8" maxlength="72" required></label>
    <label>Confirm <input name="confirm_password" type="password" minlength="8" maxlength="72" required></label>
    <button type="submit">Update password</button>
  </form>
{% endif %}
<p><a href="/forgot-password">Forgot password?</a> | <a href="/login">Back to login</a></p>
{% endblock %}
