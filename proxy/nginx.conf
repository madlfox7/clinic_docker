server {
    listen 80;

    location /health {
        proxy_pass http://api:8000/;
    }

    location / {
        default_type text/html;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><title>Clinic platform</title></head><body><h1>Clinic platform is up</h1></body></html>';
    }
}