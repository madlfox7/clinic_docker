# Shared by the proxy servers (included inside a server block). Every
# location includes the security headers itself: add_header in a location
# cancels the ones inherited from the server.
    # Only nginx's own 502/504 (api unreachable); app answers pass unchanged
    # (errors from the app are not intercepted). The file name must match the location.
    error_page 502 504 /clinic-unavailable.html;
    location = /clinic-unavailable.html {
        internal;
        root /etc/nginx/clinic/errors;
        include /etc/nginx/clinic/security_headers.conf;
        include /etc/nginx/clinic/html_no_store.conf;
    }

    location /reset-password {
        access_log /var/log/nginx/access.log clinic_path;
        include /etc/nginx/clinic/security_headers.conf;
        include /etc/nginx/clinic/html_no_store.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        # Absolute redirects built by the app (http://<host>/..., Host without the port) become
        # relative, so a redirect never leaves HTTPS.
        proxy_redirect http://$host/ /;
    }

    location /confirm-email {
        access_log /var/log/nginx/access.log clinic_path;
        include /etc/nginx/clinic/security_headers.conf;
        include /etc/nginx/clinic/html_no_store.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        # Absolute redirects built by the app (http://<host>/..., Host without the port) become
        # relative, so a redirect never leaves HTTPS.
        proxy_redirect http://$host/ /;
    }

    # Static files are served by the api (StaticFiles). No session cookie goes
    # in or out, so a cached static response can never carry a session.
    location /static/ {
        include /etc/nginx/clinic/security_headers.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control $clinic_static_cache;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        # Absolute redirects built by the app (http://<host>/..., Host without the port) become
        # relative, so a redirect never leaves HTTPS.
        proxy_redirect http://$host/ /;
    }

    location / {
        include /etc/nginx/clinic/security_headers.conf;
        include /etc/nginx/clinic/html_no_store.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        # Absolute redirects built by the app (http://<host>/..., Host without the port) become
        # relative, so a redirect never leaves HTTPS.
        proxy_redirect http://$host/ /;
    }
