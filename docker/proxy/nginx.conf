log_format clinic_path '$remote_addr - [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent';

# Cache hashed assets; revalidate others.
map $arg_v $clinic_static_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

# Reject unknown Host/SNI in provided mode.
include /tmp/nginx/clinic/default_servers.conf;

# Redirect HTTP to HTTPS.
server {
    listen 8080;
    include /tmp/nginx/clinic/server_name.conf;
    server_tokens off;
    # Omit query tokens from access logs.
    access_log /var/log/nginx/access.log clinic_path;

    include /etc/nginx/clinic/security_headers.conf;
    include /tmp/nginx/clinic/acme.conf;
    location / {
        include /etc/nginx/clinic/security_headers.conf;
        include /tmp/nginx/clinic/redirect.conf;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    include /tmp/nginx/clinic/server_name.conf;
    server_tokens off;
    # Omit query tokens from access logs.
    access_log /var/log/nginx/access.log clinic_path;

    ssl_certificate     /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Restrict TLS 1.2 to ECDHE with AEAD.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:clinic_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Keep redirects relative; hide the internal port.
    absolute_redirect off;
    include /etc/nginx/clinic/security_headers.conf;
    include /tmp/nginx/clinic/hsts.conf;
    include /etc/nginx/clinic/clinic_locations.conf;
}
