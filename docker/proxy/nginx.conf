log_format clinic_path '$remote_addr - [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent';

# Versioned static URLs (?v=<hash>) are immutable; anything else revalidates.
map $arg_v $clinic_static_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_tokens off;
    # Path only, never the query string (one-time tokens live there).
    access_log /var/log/nginx/access.log clinic_path;

    include /etc/nginx/clinic/security_headers.conf;

    # Only nginx's own 502/504 (api unreachable); app answers pass unchanged
    # (errors from the app are not intercepted). The file name must match the location.
    error_page 502 504 /clinic-unavailable.html;
    location = /clinic-unavailable.html {
        internal;
        root /etc/nginx/clinic/errors;
        include /etc/nginx/clinic/security_headers.conf;
        include /etc/nginx/clinic/html_no_store.conf;
    }

    location /reset-password {
        access_log /var/log/nginx/access.log clinic_path;
        include /etc/nginx/clinic/security_headers.conf;
        include /etc/nginx/clinic/html_no_store.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }

    location /confirm-email {
        access_log /var/log/nginx/access.log clinic_path;
        include /etc/nginx/clinic/security_headers.conf;
        include /etc/nginx/clinic/html_no_store.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }

    # Static files are served by the api (StaticFiles). No session cookie goes
    # in or out, so a cached static response can never carry a session.
    location /static/ {
        include /etc/nginx/clinic/security_headers.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control $clinic_static_cache;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }

    location / {
        include /etc/nginx/clinic/security_headers.conf;
        include /etc/nginx/clinic/html_no_store.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }
}
