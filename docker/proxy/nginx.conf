log_format clinic_path '$remote_addr - [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent';

# Versioned static URLs (?v=<hash>) are immutable; anything else revalidates.
map $arg_v $clinic_static_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

# provided mode: catch-all servers for foreign Host/SNI (444, rejected
# handshake); empty in local mode. Written by 15-clinic-tls.sh.
include /tmp/nginx/clinic/default_servers.conf;

# Plain HTTP only sends clients to the HTTPS origin from PUBLIC_BASE_URL
# (308 keeps the method and body). No app, no cookies, no HSTS here.
server {
    listen 8080;
    include /tmp/nginx/clinic/server_name.conf;
    server_tokens off;
    # Path only, never the query string (one-time tokens live there).
    access_log /var/log/nginx/access.log clinic_path;

    include /etc/nginx/clinic/security_headers.conf;
    include /tmp/nginx/clinic/acme.conf;
    location / {
        include /etc/nginx/clinic/security_headers.conf;
        include /tmp/nginx/clinic/redirect.conf;
    }
}

# HTTPS with the stand certificate (Compose secrets tls_cert and tls_key).
server {
    listen 8443 ssl;
    http2 on;
    include /tmp/nginx/clinic/server_name.conf;
    server_tokens off;
    # Path only, never the query string (one-time tokens live there).
    access_log /var/log/nginx/access.log clinic_path;

    ssl_certificate     /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2: ECDHE with AEAD only (Mozilla intermediate); TLS 1.3 uses its own suites.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:clinic_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Redirects rewritten by proxy_redirect stay relative; otherwise nginx
    # would add its own listen port (8443), not the published one.
    absolute_redirect off;
    include /etc/nginx/clinic/security_headers.conf;
    # Strict-Transport-Security, max-age from CLINIC_HSTS_MAX_AGE (15-clinic-tls.sh).
    include /tmp/nginx/clinic/hsts.conf;
    include /etc/nginx/clinic/clinic_locations.conf;
}
