services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
    secrets:
      - postgres_password
      - clinic_api_password
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        PGPASSFILE="$$(mktemp)"
        export PGPASSFILE
        trap 'rm -f "$$PGPASSFILE"' EXIT
        chmod 600 "$$PGPASSFILE"
        printf 'db:5432:*:%s:%s\n' "$$POSTGRES_USER" "$$(cat /run/secrets/postgres_password)" > "$$PGPASSFILE"
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /docker-entrypoint-initdb.d/init.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /docker-entrypoint-initdb.d/roles.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/rls.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -v clinic_api_password="$$(cat /run/secrets/clinic_api_password)" \
          -f /migrations/set_api_password.sql

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_api
      PGDATABASE: ${POSTGRES_DB:-clinic}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@clinic.local}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-5}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    secrets:
      - clinic_api_password
      - session_secret
      - smtp_password
    networks:
      - frontend
      - backend
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_api
      PGDATABASE: ${POSTGRES_DB:-clinic}
    secrets:
      - clinic_api_password
      - demo_password
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "seed.py"]

  mailpit:
    image: axllent/mailpit:v1.27.1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - frontend
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    ports:
      - "${CLINIC_PROXY_PORT:-8080}:8080"
    networks:
      - frontend
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  clinic_api_password:
    file: ./secrets/clinic_api_password
  session_secret:
    file: ./secrets/session_secret
  smtp_password:
    file: ./secrets/smtp_password
  demo_password:
    file: ./secrets/demo_password

volumes:
  db_data:

networks:
  frontend:
  backend:
    internal: true
