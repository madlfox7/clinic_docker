services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    env_file: .env
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    env_file: .env
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CLINIC_API_PASSWORD: ${CLINIC_API_PASSWORD:?Set CLINIC_API_PASSWORD in .env}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /docker-entrypoint-initdb.d/init.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /docker-entrypoint-initdb.d/roles.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/rls.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/set_api_password.sql

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      DATABASE_URL: postgresql://clinic_api:${CLINIC_API_PASSWORD:?Set CLINIC_API_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@clinic.local}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-5}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    networks:
      - frontend
      - backend
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_api
      PGPASSWORD: ${CLINIC_API_PASSWORD:?Set CLINIC_API_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "seed.py"]

  mailpit:
    image: axllent/mailpit:v1.27.1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - frontend
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    ports:
      - "${CLINIC_PROXY_PORT:-8080}:8080"
    networks:
      - frontend
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db_data:

networks:
  frontend:
  backend:
    internal: true
