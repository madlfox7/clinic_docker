services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    env_file: .env
    environment:
      TZ: UTC
      PGTZ: UTC
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    env_file: .env
    environment:
      TZ: UTC
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CLINIC_API_PASSWORD: ${CLINIC_API_PASSWORD:?Set CLINIC_API_PASSWORD in .env}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /docker-entrypoint-initdb.d/init.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /docker-entrypoint-initdb.d/roles.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/rls.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/set_api_password.sql

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      TZ: UTC
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      DATABASE_URL: postgresql://clinic_api:${CLINIC_API_PASSWORD:?Set CLINIC_API_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    networks:
      - frontend
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - frontend
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db_data:

networks:
  frontend:
  backend:
    internal: true
