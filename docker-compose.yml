services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
    secrets:
      - postgres_password
      - clinic_api_password
      - audit_db_password
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        PGPASSFILE="$$(mktemp)"
        export PGPASSFILE
        trap 'rm -f "$$PGPASSFILE"' EXIT
        chmod 600 "$$PGPASSFILE"
        printf 'db:5432:*:%s:%s\n' "$$POSTGRES_USER" "$$(cat /run/secrets/postgres_password)" > "$$PGPASSFILE"
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /docker-entrypoint-initdb.d/init.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /docker-entrypoint-initdb.d/roles.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/rls.sql
        [ -s /run/secrets/clinic_api_password ] || { echo 'clinic_api_password missing' >&2; exit 1; }
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/set_api_password.sql
        [ -s /run/secrets/audit_db_password ] || { echo 'audit_db_password missing' >&2; exit 1; }
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/set_auditor_password.sql

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_api
      PGDATABASE: ${POSTGRES_DB:-clinic}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@clinic.local}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-5}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8450}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-true}
      # Shared audit freshness limits.
      CLINIC_AUDIT_ANCHOR_INTERVAL: ${CLINIC_AUDIT_ANCHOR_INTERVAL:-60}
      CLINIC_AUDIT_FULL_CHECK_EVERY: ${CLINIC_AUDIT_FULL_CHECK_EVERY:-600}
    # API gets status only; no audit secrets.
    volumes:
      - audit_status:/audit_status:ro
    secrets:
      - clinic_api_password
      - session_secret
      - smtp_password
      # API-only medical field keys.
      - field_encryption_key
      - field_encryption_previous_keys
    # Proxy-only API ingress; SMTP egress.
    networks:
      - app
      - backend
      - mail
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_api
      PGDATABASE: ${POSTGRES_DB:-clinic}
    secrets:
      - clinic_api_password
      - demo_password
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Initialize registry before journal writes.
      audit_prepare:
        condition: service_completed_successfully
    command: ["python", "seed.py"]

  # HMAC anchors stay outside DB; key mounted only here.
  audit_anchor:
    build:
      context: .
      dockerfile: docker/audit_anchor/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_auditor
      PGDATABASE: ${POSTGRES_DB:-clinic}
      CLINIC_AUDIT_ANCHOR_INTERVAL: ${CLINIC_AUDIT_ANCHOR_INTERVAL:-60}
      # Full-chain verification cadence.
      CLINIC_AUDIT_FULL_CHECK_EVERY: ${CLINIC_AUDIT_FULL_CHECK_EVERY:-600}
    secrets:
      - audit_db_password
      - audit_anchor_key
    # External anchors survive wipes; API status is read-only.
    volumes:
      - audit_anchors:/anchors
      - audit_status:/status
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Red status/missed cycles fail health; retries allow slow startup.
    healthcheck:
      test: ["CMD", "python", "anchor.py", "--health"]
      interval: 15s
      timeout: 20s
      retries: 4
      start_period: 30s

  # Prevent fresh journals looking like lost registries.
  audit_prepare:
    build:
      context: .
      dockerfile: docker/audit_anchor/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_auditor
      PGDATABASE: ${POSTGRES_DB:-clinic}
    secrets:
      - audit_db_password
      - audit_anchor_key
    volumes:
      - audit_anchors:/anchors
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Set permissions as root; prepare runs uid 10002 without capabilities.
    user: "0"
    command:
      - sh
      - -c
      - >-
        chown 10002:10002 /anchors && chmod 700 /anchors &&
        exec setpriv --reuid=10002 --regid=10002 --clear-groups python anchor.py --prepare
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.27.1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - mail
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    # Bind locally if needed; replace both ports in overrides.
    ports:
      - "${CLINIC_PROXY_BIND:-0.0.0.0}:${CLINIC_PROXY_PORT:-8080}:8080"
      - "${CLINIC_PROXY_BIND:-0.0.0.0}:${CLINIC_PROXY_TLS_PORT:-8450}:8443"
    networks:
      - frontend
      - app
    # Proxy-only server key; CA key stays on host.
    secrets:
      - tls_cert
      - tls_key
    # Invalid TLS settings stop startup.
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8450}
      CLINIC_HSTS_MAX_AGE: ${CLINIC_HSTS_MAX_AGE:-3600}
      CLINIC_TLS_MODE: ${CLINIC_TLS_MODE:-local}
      CLINIC_ACME_WEBROOT: ${CLINIC_ACME_WEBROOT:-false}
      # 1 enables a public tunnel; default 0.
      CLINIC_PUBLIC_TUNNEL: ${CLINIC_PUBLIC_TUNNEL:-0}
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  clinic_api_password:
    file: ./secrets/clinic_api_password
  session_secret:
    file: ./secrets/session_secret
  smtp_password:
    file: ./secrets/smtp_password
  demo_password:
    file: ./secrets/demo_password
  field_encryption_key:
    file: ./secrets/field_encryption_key
  field_encryption_previous_keys:
    file: ./secrets/field_encryption_previous_keys
  audit_db_password:
    file: ./secrets/audit_db_password
  audit_anchor_key:
    file: ./secrets/audit_anchor_key
  tls_cert:
    file: ./secrets/tls/server.crt
  tls_key:
    file: ./secrets/tls/server.key

volumes:
  db_data:
  audit_status: {}
  # External anchors survive wipes; override name for disposable stands.
  audit_anchors:
    external: true
    name: ${CLINIC_AUDIT_ANCHOR_VOLUME:-${COMPOSE_PROJECT_NAME}_audit_anchors}

networks:
  frontend: {}
  app:
    internal: true
  backend:
    internal: true
  mail: {}
