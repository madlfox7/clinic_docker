services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
    secrets:
      - postgres_password
      - clinic_api_password
      - audit_db_password
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        PGPASSFILE="$$(mktemp)"
        export PGPASSFILE
        trap 'rm -f "$$PGPASSFILE"' EXIT
        chmod 600 "$$PGPASSFILE"
        printf 'db:5432:*:%s:%s\n' "$$POSTGRES_USER" "$$(cat /run/secrets/postgres_password)" > "$$PGPASSFILE"
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /docker-entrypoint-initdb.d/init.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /docker-entrypoint-initdb.d/roles.sql
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/rls.sql
        [ -s /run/secrets/clinic_api_password ] || { echo 'clinic_api_password missing' >&2; exit 1; }
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/set_api_password.sql
        [ -s /run/secrets/audit_db_password ] || { echo 'audit_db_password missing' >&2; exit 1; }
        psql -X -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          -f /migrations/set_auditor_password.sql

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_api
      PGDATABASE: ${POSTGRES_DB:-clinic}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@clinic.local}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-5}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8450}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-true}
      # banner on /admin/audit (plan 18.2): the freshness limits come from the
      # api's own environment, the same values audit_anchor gets
      CLINIC_AUDIT_ANCHOR_INTERVAL: ${CLINIC_AUDIT_ANCHOR_INTERVAL:-60}
      CLINIC_AUDIT_FULL_CHECK_EVERY: ${CLINIC_AUDIT_FULL_CHECK_EVERY:-600}
    # status.json of audit_anchor, read-only; no anchor key, no anchors and no
    # auditor password in the api
    volumes:
      - audit_status:/audit_status:ro
    secrets:
      - clinic_api_password
      - session_secret
      - smtp_password
      # medical field keys: api only, never db/migrate/seed
      - field_encryption_key
      - field_encryption_previous_keys
    # app: only proxy reaches api:8000; mail: SMTP to mailpit or an outside server.
    networks:
      - app
      - backend
      - mail
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGTZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_api
      PGDATABASE: ${POSTGRES_DB:-clinic}
    secrets:
      - clinic_api_password
      - demo_password
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      # З-11: the chain registry is opened before anything writes to the journal
      audit_prepare:
        condition: service_completed_successfully
    command: ["python", "seed.py"]

  # Audit chain anchors (plan 17 §8): reads the journal as clinic_auditor and
  # appends HMAC-signed anchor lines outside the database. The HMAC key is
  # mounted here only (never db, migrate, api, seed, proxy, mailpit).
  audit_anchor:
    build:
      context: .
      dockerfile: docker/audit_anchor/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_auditor
      PGDATABASE: ${POSTGRES_DB:-clinic}
      CLINIC_AUDIT_ANCHOR_INTERVAL: ${CLINIC_AUDIT_ANCHOR_INTERVAL:-60}
      # full check of the whole chain (verify_audit): on start, then every N s
      CLINIC_AUDIT_FULL_CHECK_EVERY: ${CLINIC_AUDIT_FULL_CHECK_EVERY:-600}
    secrets:
      - audit_db_password
      - audit_anchor_key
    # audit_anchors: an external named volume of this project (see volumes:),
    # so "down -v", "make reset" and "make fclean" keep the anchors and the
    # chain registry. Inside it /anchors is 700 and owned by uid 10002
    # (audit_prepare); no host directory, so no host uid, ACL or file system
    # (WSL /mnt/c, rootless Docker) is involved.
    # audit_status: the public status.json of the loop (plan 18.1), written
    # only here; the api mounts it read-only for the banner on /admin/audit.
    volumes:
      - audit_anchors:/anchors
      - audit_status:/status
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # --health only reads the status file of the loop (red: last cycle not ok,
    # e.g. chain_replaced or a broken chain, or no cycle/anchor for 2 intervals).
    # timeout/retries leave room for a slow python start on a loaded host;
    # a red status still turns unhealthy within about 4 x 15 s.
    healthcheck:
      test: ["CMD", "python", "anchor.py", "--health"]
      interval: 15s
      timeout: 20s
      retries: 4
      start_period: 30s

  # One-shot, after migrate and before seed/api (З-11): on a fresh stand it
  # writes the "open" line of the chain registry before the first event, so
  # the loop never mistakes a fresh journal for a lost registry. Same image,
  # key and directory as audit_anchor; with a registry it does nothing, and
  # alarms stay the loop's job (anchor.py --prepare).
  audit_prepare:
    build:
      context: .
      dockerfile: docker/audit_anchor/Dockerfile
    environment:
      TZ: Asia/Yerevan
      PGHOST: db
      PGUSER: clinic_auditor
      PGDATABASE: ${POSTGRES_DB:-clinic}
    secrets:
      - audit_db_password
      - audit_anchor_key
    volumes:
      - audit_anchors:/anchors
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Starts as root only to set the owner and mode of the volume root
    # (not recursive), then drops to uid 10002 (setpriv, no capabilities
    # left) for anchor.py --prepare, which checks the directory first
    # (--check-dir: 700, uid 10002, no ACL) and stops seed/api if it is not.
    user: "0"
    command:
      - sh
      - -c
      - >-
        chown 10002:10002 /anchors && chmod 700 /anchors &&
        exec setpriv --reuid=10002 --regid=10002 --clear-groups python anchor.py --prepare
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.27.1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - mail
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    # Listens on all interfaces by default; set CLINIC_PROXY_BIND=127.0.0.1 in .env
    # to open the site on this machine only. HTTPS goes to CLINIC_PROXY_TLS_PORT
    # (stands: HTTP port + 370, e.g. 8080/8450, 8082/8452, 8083/8453). Port lists
    # from override files are appended, so an override that changes these ports
    # must use `ports: !override` and list both lines.
    ports:
      - "${CLINIC_PROXY_BIND:-0.0.0.0}:${CLINIC_PROXY_PORT:-8080}:8080"
      - "${CLINIC_PROXY_BIND:-0.0.0.0}:${CLINIC_PROXY_TLS_PORT:-8450}:8443"
    networks:
      - frontend
      - app
    # The server certificate and key, for the proxy only. The CA key
    # (secrets/tls/ca.key) stays on the host and is never mounted.
    secrets:
      - tls_cert
      - tls_key
    # Read by docker/proxy/15-clinic-tls.sh at start: redirect origin, HSTS
    # max-age, TLS mode. A bad value stops the proxy.
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8450}
      CLINIC_HSTS_MAX_AGE: ${CLINIC_HSTS_MAX_AGE:-3600}
      CLINIC_TLS_MODE: ${CLINIC_TLS_MODE:-local}
      CLINIC_ACME_WEBROOT: ${CLINIC_ACME_WEBROOT:-false}
      # 1: PUBLIC_BASE_URL is a public tunnel (ngrok demo) in front of the
      # local stand; local mode only. Default 0.
      CLINIC_PUBLIC_TUNNEL: ${CLINIC_PUBLIC_TUNNEL:-0}
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  clinic_api_password:
    file: ./secrets/clinic_api_password
  session_secret:
    file: ./secrets/session_secret
  smtp_password:
    file: ./secrets/smtp_password
  demo_password:
    file: ./secrets/demo_password
  field_encryption_key:
    file: ./secrets/field_encryption_key
  field_encryption_previous_keys:
    file: ./secrets/field_encryption_previous_keys
  audit_db_password:
    file: ./secrets/audit_db_password
  audit_anchor_key:
    file: ./secrets/audit_anchor_key
  tls_cert:
    file: ./secrets/tls/server.crt
  tls_key:
    file: ./secrets/tls/server.key

volumes:
  db_data:
  audit_status: {}
  # Anchors and chain registry (plan 17 §8). External: "docker compose down -v"
  # never removes it; make start creates it (label clinic.audit=keep) when it
  # is missing. One per project (fixer_audit_anchors, e6_...), or the name in
  # CLINIC_AUDIT_ANCHOR_VOLUME (the disposable e6 stand).
  audit_anchors:
    external: true
    name: ${CLINIC_AUDIT_ANCHOR_VOLUME:-${COMPOSE_PROJECT_NAME}_audit_anchors}

networks:
  frontend: {}
  app:
    internal: true
  backend:
    internal: true
  mail: {}
